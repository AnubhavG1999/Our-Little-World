<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Our Little World</title>
<meta name="description" content="A little pixel room for two.">
<meta name="theme-color" content="#1F1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Our World">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="backdrop"></div>
<div id="view">
  <div id="stage">
    <div id="base"></div>
    <div id="bar">
      <div id="ctl"><div>
        <button data-a="kiss">Kiss</button><button data-a="hug">Hug</button><button data-a="sit">Sit</button><button data-a="feed">Eat</button><button data-a="sleep">Sleep</button><button data-a="cuddle">Cuddle</button><button data-a="e">Surprise</button>
        <button data-a="photo">Camera</button><button data-a="cat">Pet cat</button><button data-a="feedcat">Feed cat</button><button data-a="night">Day / Night</button><button data-a="emote">Emote</button><button data-a="chat">Messages</button>
      </div></div>
      <div class="say sel" id="sg"><img src="assets/portrait-g.png" alt="You"><div><b>♥ You</b><p></p></div></div>
      <div class="say" id="sb"><img src="assets/portrait-b.png" alt="Anubhav"><div><b>♥ Anubhav</b><p></p></div></div>
    </div>
    <div id="fm"></div><div class="phone" id="phg"></div><div class="phone" id="phb"></div><div id="tint"></div><div id="sky"></div><div id="bowl"><i></i></div>
    <button id="dayb" aria-label="Day count and settings"></button><i id="moon"></i>
    <img id="plant" alt="Our plant">
    <button id="frame" aria-label="Our latest Memory"><img alt=""></button>
  </div>
  <div id="ui">
    <div id="flash"></div>
    <div id="chat"><div class="tb"><button data-tab="chat" class="on">Messages</button><button data-tab="letter">Letters</button><button id="x" aria-label="Close">x</button></div>
      <div id="log"></div><div class="wr"><textarea id="tx" rows="2"></textarea><button id="send">Send</button></div></div>
    <div id="role"><p id="rq">Who is playing on this device?</p><div id="rpick"><button data-r="g"><img src="assets/portrait-g.png" alt=""><span>Pratiksha</span></button><button data-r="b"><img src="assets/portrait-b.png" alt=""><span>Anubhav</span></button></div><button id="gin" hidden>Sign in with Google</button></div>
    <div id="toast" role="status"></div>
  </div>
</div>
<div id="hud">
  <div id="top">
    <button class="glass" id="tday" aria-label="Day count and settings"><b id="tdayn">Day 1</b><small>Our Little World</small></button>
    <div id="clocks"><span id="clk1"></span><span id="clk2"></span></div>
    <button class="ib glass" data-a="chat" aria-label="Messages">💬</button>
    <button class="ib glass" id="hzoom" aria-label="Zoom out">⤢</button>
  </div>
  <div id="bot">
    <div id="joy" aria-label="Joystick"><i></i></div>
    <div id="acts">
      <button class="act glass" data-a="hug" style="--x:-122px;--y:0px"><i>🤗</i>Hug</button>
      <button class="act glass" data-a="cuddle" style="--x:-106px;--y:-61px"><i>☁️</i>Cuddle</button>
      <button class="act glass" data-a="photo" style="--x:-61px;--y:-106px"><i>📷</i>Camera</button>
      <button class="act glass" id="hmore" style="--x:0px;--y:-122px"><i>✨</i>More</button>
      <button class="act big" data-a="kiss"><i>💋</i>Kiss</button>
    </div>
  </div>
</div>
<p class="note">Tip: Gamer view (Settings → View) fits phones held upright best.</p>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/sprites.js"></script>
<script src="js/localdb.js"></script>
<script src="js/sound.js"></script>
<script src="js/room.js"></script>
<script src="js/ui.js"></script>
<script src="js/gamer.js"></script>
<script src="js/fx.js"></script>
<script src="js/wardrobe.js"></script>
<script src="js/extras.js"></script>
<script src="js/memories.js"></script>
<script src="js/games.js"></script>
<script src="js/map.js"></script>
<script src="js/plans.js"></script>
<script src="js/jar.js"></script>
<script src="js/music.js"></script>
<script src="js/settings.js"></script>
<script src="js/sync.js"></script>
</body>
</html>
