<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Little World</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1F1220;--panel:#FDEFEE;--edge:#EFA0B5;--ink:#7A2A46;--soft:#B5677F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Pixelify Sans",ui-monospace,monospace}
#stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:3/2;container-type:inline-size;overflow:hidden;background-size:100% 100%;image-rendering:pixelated;user-select:none;-webkit-user-select:none;cursor:pointer}
.spr{position:absolute;image-rendering:pixelated;pointer-events:none;transform:translate(-50%,-100%)}
.hs{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;border-radius:1cqw}
.hs:hover,.hs:focus-visible{outline:.25cqw dashed #fff;outline-offset:-.25cqw;background:rgba(255,255,255,.12)}
#base{position:absolute;left:0;right:0;bottom:0;top:83.6%;background:#2A1626}
#bar{position:absolute;left:1.6%;right:1.6%;bottom:1.6%;top:84.6%;background:var(--panel);border:.25cqw solid var(--edge);border-radius:.8cqw;display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:1cqw;padding:.7cqw 1cqw;align-items:center;color:var(--ink)}
#ctl{display:flex;flex-direction:column;gap:.5cqw}
#ctl div{display:flex;gap:.6cqw}
#ctl button{font:inherit;font-size:max(9px,1.35cqw);color:var(--ink);background:#fff;border:.2cqw solid var(--edge);border-radius:.6cqw;padding:.4cqw .9cqw;cursor:pointer}
#ctl button:hover{background:#FFE3EA}
#ctl small{font-size:max(8px,1.1cqw);color:var(--soft);line-height:1.3}
.say{display:flex;gap:1cqw;align-items:center;border:.2cqw dashed var(--edge);border-radius:.6cqw;padding:.5cqw;height:100%;cursor:pointer;min-width:0}
.say.sel{border-style:solid;background:#FFE9EF}
.say img{height:100%;aspect-ratio:1;border-radius:.5cqw;image-rendering:pixelated}
.say b{font-size:max(9px,1.4cqw);color:#B23A5E}
.say p{margin:.2cqw 0 0;font-size:max(9px,1.45cqw);line-height:1.25}
#toast{position:absolute;left:50%;top:3%;transform:translateX(-50%);background:var(--panel);color:var(--ink);border:.25cqw solid var(--edge);border-radius:.8cqw;padding:.8cqw 1.6cqw;font-size:max(10px,1.6cqw);opacity:0;transition:opacity .25s;pointer-events:none;z-index:2000;white-space:nowrap}
#toast.on{opacity:1}
.ht{position:absolute;color:#E8506F;font-style:normal;font-size:2.6cqw;pointer-events:none;z-index:999;animation:up 1.4s forwards}
@keyframes up{to{transform:translateY(-4cqw);opacity:0}}
.note{display:none;color:#B9A6CF;font-size:14px;margin:10px}
#fm{position:absolute;display:none;flex-direction:column;gap:.4cqw;background:var(--panel);border:.25cqw solid var(--edge);border-radius:.8cqw;padding:.6cqw;z-index:3500;transform:translate(-50%,-50%)}
#fm button{font:inherit;font-size:max(9px,1.3cqw);color:var(--ink);background:#fff;border:.2cqw solid var(--edge);border-radius:.6cqw;padding:.4cqw 1cqw;cursor:pointer;white-space:nowrap}
#fm button:hover{background:#FFE3EA}
.phone{position:absolute;display:none;width:1.4%;aspect-ratio:.55;background:#2B2233;border:.15cqw solid #fff;border-radius:.3cqw;z-index:900;transform:translate(-50%,-100%)}
.phone::after{content:"";position:absolute;inset:10%;background:#8FD3FF;border-radius:.2cqw}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5000;transition:opacity .3s}
#flash.on{opacity:.9;transition:none}
#ctl div{flex-wrap:wrap}#ctl button{font-size:max(8px,1.15cqw);padding:.25cqw .6cqw}
.say p{overflow:hidden;max-height:4.4em}
#tint{position:absolute;inset:0;pointer-events:none;z-index:850}
#sky{position:absolute;left:44.2%;top:0;width:22.2%;height:15.4%;display:none;background:radial-gradient(circle at 78% 32%,#FFF6B8 0 7%,transparent 8%),linear-gradient(#7FC8F2,#E3F5FF)}
#bowl{position:absolute;left:47%;top:77%;width:4.4%;aspect-ratio:2.2/1;transform:translate(-50%,-100%);background:#E9799A;border:.25cqw solid #52303F;border-radius:0 0 50% 50%/0 0 100% 100%;z-index:770}
#bowl i{position:absolute;left:8%;right:8%;bottom:34%;height:0;background:#B8783A;border-radius:50% 50% 0 0/100% 100% 0 0;transition:height .6s}
#chat{position:absolute;right:1.6%;top:2.5%;width:36%;bottom:17%;background:var(--panel);border:.25cqw solid var(--edge);border-radius:.9cqw;display:none;flex-direction:column;z-index:3000;color:var(--ink);padding:.8cqw;gap:.6cqw}
#chat.on{display:flex}
#chat .tb{display:flex;gap:.5cqw}
#chat .tb button{flex:1;font:inherit;font-size:max(9px,1.3cqw);border:.2cqw solid var(--edge);background:#fff;border-radius:.6cqw;color:var(--ink);cursor:pointer;padding:.3cqw}
#chat .tb button.on{background:var(--edge);color:#fff}
#chat .tb #x{flex:0 0 3cqw}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:.5cqw;font-size:max(9px,1.35cqw)}
.m{max-width:85%;padding:.5cqw .9cqw;border-radius:.8cqw;background:#fff;border:.15cqw solid var(--edge);line-height:1.3;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;background:#FFE3EA}
.m small{display:block;color:var(--soft);font-size:.8em}
.wr{display:flex;gap:.5cqw}
.wr textarea{flex:1;font:inherit;font-size:max(10px,1.35cqw);border:.2cqw solid var(--edge);border-radius:.6cqw;padding:.5cqw;resize:none;background:#fff;color:var(--ink)}
.wr button{font:inherit;font-size:max(9px,1.3cqw);background:#B23A5E;color:#fff;border:0;border-radius:.6cqw;padding:0 1.2cqw;cursor:pointer}
#role{position:absolute;inset:0;background:rgba(31,18,32,.9);z-index:4000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;color:#fff;font-size:max(12px,2.4cqw)}
#role.on{display:flex}
#role div{display:flex;gap:3cqw}
#role button{background:var(--panel);border:.3cqw solid var(--edge);border-radius:1cqw;padding:1.2cqw;font:inherit;font-size:max(11px,1.8cqw);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.6cqw}
#role img{width:12cqw;image-rendering:pixelated;border-radius:.6cqw}
#role [hidden]{display:none!important}
.bub{position:absolute;transform:translateX(-50%);background:#fff;color:var(--ink);border:.2cqw solid var(--edge);border-radius:.8cqw;padding:.3cqw 1cqw;font-size:max(9px,1.4cqw);display:none;z-index:1600;pointer-events:none;white-space:nowrap}
@media (orientation:portrait){.note{display:block}}
@media (prefers-reduced-motion:reduce){.ht{animation-duration:.01s}}
</style>
</head>
<body>
<div id="stage">
  <div id="base"></div>
  <div id="bar">
    <div id="ctl"><div>
      <button data-a="kiss">Kiss</button><button data-a="hug">Hug</button><button data-a="sit">Sit</button><button data-a="feed">Eat</button><button data-a="sleep">Sleep</button><button data-a="cuddle">Cuddle</button><button data-a="e">Surprise</button>
      <button data-a="photo">Camera</button><button data-a="cat">Pet cat</button><button data-a="feedcat">Feed cat</button><button data-a="night">Day / Night</button><button data-a="chat">Messages</button>
    </div></div>
    <div class="say sel" id="sg"><img src="assets/portrait-g.png" alt="You"><div><b>♥ You</b><p></p></div></div>
    <div class="say" id="sb"><img src="assets/portrait-b.png" alt="Him"><div><b>♥ Him</b><p></p></div></div>
  </div>
  <div id="fm"></div><div id="flash"></div><div class="phone" id="phg"></div><div class="phone" id="phb"></div><div id="tint"></div><div id="sky"></div><div id="bowl"><i></i></div>
  <div id="chat"><div class="tb"><button data-tab="chat" class="on">Messages</button><button data-tab="letter">Letters</button><button id="x" aria-label="Close">x</button></div>
    <div id="log"></div><div class="wr"><textarea id="tx" rows="2"></textarea><button id="send">Send</button></div></div>
  <div id="role"><p id="rq">Who is playing on this device?</p><div id="rpick"><button data-r="g"><img src="assets/portrait-g.png" alt=""><span>Pratiksha</span></button><button data-r="b"><img src="assets/portrait-b.png" alt=""><span>Him</span></button></div><button id="gin" hidden>Sign in with Google</button></div>
  <div id="toast" role="status"></div>
</div>
<p class="note">Rotate your phone sideways for the best view.</p>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script>
const S = {
  "g_idle": {"src": "assets/sprites/g_idle.png", "w": 98, "h": 163},
  "g_down": {"src": "assets/sprites/g_down.png", "w": 97, "h": 162},
  "g_left": {"src": "assets/sprites/g_left.png", "w": 89, "h": 163},
  "g_right": {"src": "assets/sprites/g_right.png", "w": 92, "h": 165},
  "g_up": {"src": "assets/sprites/g_up.png", "w": 94, "h": 172},
  "g_wave": {"src": "assets/sprites/g_wave.png", "w": 106, "h": 157},
  "g_happy": {"src": "assets/sprites/g_happy.png", "w": 99, "h": 158},
  "g_shy": {"src": "assets/sprites/g_shy.png", "w": 96, "h": 157},
  "g_sit": {"src": "assets/sprites/g_sit.png", "w": 98, "h": 140},
  "b_idle": {"src": "assets/sprites/b_idle.png", "w": 85, "h": 172},
  "b_down": {"src": "assets/sprites/b_down.png", "w": 85, "h": 175},
  "b_left": {"src": "assets/sprites/b_left.png", "w": 87, "h": 175},
  "b_right": {"src": "assets/sprites/b_right.png", "w": 87, "h": 175},
  "b_up": {"src": "assets/sprites/b_up.png", "w": 82, "h": 179},
  "b_wave": {"src": "assets/sprites/b_wave.png", "w": 105, "h": 168},
  "b_happy": {"src": "assets/sprites/b_happy.png", "w": 90, "h": 168},
  "b_shy": {"src": "assets/sprites/b_shy.png", "w": 88, "h": 167},
  "b_sit": {"src": "assets/sprites/b_sit.png", "w": 101, "h": 150},
  "g_type": {"src": "assets/sprites/g_type.png", "w": 115, "h": 144},
  "b_type": {"src": "assets/sprites/b_type.png", "w": 99, "h": 152},
  "stand": {"src": "assets/sprites/stand.png", "w": 133, "h": 152},
  "hands": {"src": "assets/sprites/hands.png", "w": 137, "h": 148},
  "hug": {"src": "assets/sprites/hug.png", "w": 111, "h": 144},
  "kiss": {"src": "assets/sprites/kiss.png", "w": 128, "h": 139},
  "sit": {"src": "assets/sprites/sit.png", "w": 182, "h": 142},
  "lap": {"src": "assets/sprites/lap.png", "w": 206, "h": 135},
  "feed": {"src": "assets/sprites/feed.png", "w": 158, "h": 135},
  "boop": {"src": "assets/sprites/boop.png", "w": 165, "h": 143},
  "play": {"src": "assets/sprites/play.png", "w": 183, "h": 130},
  "cuddle": {"src": "assets/sprites/cuddle.png", "w": 211, "h": 123},
  "sleep": {"src": "assets/sprites/sleep.png", "w": 190, "h": 110},
  "look": {"src": "assets/sprites/look.png", "w": 164, "h": 126},
  "talk": {"src": "assets/sprites/talk.png", "w": 163, "h": 130},
  "photo": {"src": "assets/sprites/photo.png", "w": 159, "h": 126},
  "cat_sit": {"src": "assets/sprites/cat_sit.png", "w": 68, "h": 78},
  "cat_happy": {"src": "assets/sprites/cat_happy.png", "w": 68, "h": 78},
  "cat_sleep": {"src": "assets/sprites/cat_sleep.png", "w": 88, "h": 46},
  "cat_r1": {"src": "assets/sprites/cat_r1.png", "w": 108, "h": 72},
  "cat_r2": {"src": "assets/sprites/cat_r2.png", "w": 108, "h": 72},
  "cat_l1": {"src": "assets/sprites/cat_l1.png", "w": 108, "h": 72},
  "cat_l2": {"src": "assets/sprites/cat_l2.png", "w": 108, "h": 72}
};
const BG = "assets/bg.webp";
const K = 1.15;               // sprite scale vs. the sheet
const $ = id => document.getElementById(id);
const stage = $("stage");
stage.style.backgroundImage = `url(${BG})`;

// ---------- editable words ----------
const ACT = {
  kiss:["Mwah.","Hehe, again?"], hug:["Don't let go.","Never."], hands:["Your hand fits mine.","Always has."],
  sit:["Stay a while?","As long as you want."], lap:["Five more minutes...","Take ten."], feed:["Open up!","Mmm, more."],
  boop:["Boop!","Hey!"], play:["I'm winning.","Keep dreaming."], cuddle:["Cold?","Now I'm warm."],
  look:["What?","Nothing. Just you."], talk:["Guess what happened today.","Tell me everything."],
  photo:["Smile!","Which side is better?"], sleep:["Goodnight.","Goodnight."], stand:["Just us.","Just us."]
};
const CHAT = [["Come closer...","Always."],["Miss you.","Miss you more."],["What should we do today?","Anything with you."],["Look, the stars are out.","Not as pretty as you."]];
const SPOTS = [
  ["Letters","Our letters are coming soon.",670,188,800,340],["Games","Games are coming soon.",1190,436,1400,700],
  ["Memories","Our memories are coming soon.",400,628,645,800],["Surprise me","A surprise is coming soon.",1135,700,1310,830],
  ["Home","",20,146,200,190],["Our Letters","Our letters are coming soon.",20,196,200,240],["Memories","Our memories are coming soon.",20,246,200,290],
  ["Games","Games are coming soon.",20,296,200,340],["Our Map","Our map is coming soon.",20,346,200,390],["Future Plans","Our plans are coming soon.",20,396,200,440],
  ["Music","Music is coming soon.",20,446,200,490],["Settings","Settings are coming soon.",20,496,200,540]
];
// -------------------------------------

const px = (x,y,w,h)=>[x/15.36,y/10.24,(w)/15.36,(h)/10.24];
let tt; const toast = t => { const e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove("on"),2200); };
const heart = (x,y)=>{const h=document.createElement("i");h.className="ht";h.textContent="♥";h.style.left=x+"%";h.style.top=(y-14)+"%";stage.appendChild(h);setTimeout(()=>h.remove(),1400)};
SPOTS.forEach(([n,msg,x0,y0,x1,y1])=>{
  const b=document.createElement("button"); b.className="hs"; b.setAttribute("aria-label",n);
  b.style.cssText=`left:${x0/15.36}%;top:${y0/10.24}%;width:${(x1-x0)/15.36}%;height:${(y1-y0)/10.24}%`;
  b.onclick=e=>{e.stopPropagation(); if(n==="Letters"||n==="Our Letters"){openChat("letter");return;} if(msg) toast(msg); else toast("Our little world.");};
  stage.appendChild(b);
});

const P = {g:{x:45.6,y:60.5,tx:null,ty:null,pose:null,mv:false,d:"down"}, b:{x:56.5,y:60.5,tx:null,ty:null,pose:null,mv:false,d:"down"}};
const els = {g:mk(), b:mk(), p:mk(), c:mk()};
function mk(){const i=document.createElement("img");i.className="spr";i.alt="";stage.insertBefore(i,$("base"));return i}
let sel="g", pair=null, pairT=0;
let LIVE=false;               // true once signed in: you move only your own character, the other one follows the other device
const keys=new Set();

function say(g,b){ if(g!=null) document.querySelector("#sg p").textContent=g; if(b!=null) document.querySelector("#sb p").textContent=b; }
function pick(k){ sel=k; $("sg").classList.toggle("sel",k==="g"); $("sb").classList.toggle("sel",k==="b"); }
$("sg").onclick=e=>{e.stopPropagation();if(!LIVE)pick("g")}; $("sb").onclick=e=>{e.stopPropagation();if(!LIVE)pick("b")};

function act(name){
  if(name==="cat"){ petCat(); return; }
  if(name==="feedcat"){ feedCat(); return; }
  if(name==="night"){ setWorld({night:!W.night}); return; }
  if(name==="chat"){ openChat("chat"); return; }
  if(pair&&pair.hold){ clearHold(); return; }
  if(pair) return;
  if(["sit","sleep","cuddle"].includes(name)&&Math.hypot(P.g.x-P.b.x,(P.g.y-P.b.y)/1.5)>17){ const a=P[sel]; a.pose="sit"; a.hold=1; a.tx=null; return; }
  const g=P.g,b=P.b, d=Math.hypot(g.x-b.x,(g.y-b.y)/1.5);
  if(d>17){ say("Come closer...","Always."); return; }
  const list=Object.keys(ACT).filter(k=>!["kiss","hug"].includes(k));
  const n = name==="e" ? list[Math.floor(Math.random()*list.length)] : name;
  startPair({n,x:(g.x+b.x)/2,y:Math.max(g.y,b.y),hold:["sit","sleep","cuddle"].includes(n)},true);
}
// p: {n, x, y, hold, f (from furniture)}; mine = started on this device, so tell the other one
function startPair(p,mine){
  const n=p.n; pair={n,x:p.x,y:p.y}; pairT=3.4; job=null;
  for(const k of ["g","b"]){ const a=P[k]; a.tx=null; a.phone=0; if(a.hold){a.pose=null;a.hold=0;} }
  if(p.hold){pair.hold=1;pairT=1e9;}
  say(ACT[n][0],ACT[n][1]);
  if(p.f) heart(pair.x,pair.y);
  else{
    if(n==="photo") setTimeout(()=>{$("flash").classList.add("on");setTimeout(()=>$("flash").classList.remove("on"),120)},1500);
    if(["kiss","hug","hands","cuddle"].includes(n)) heart(pair.x,pair.y);
    if(cat.st!=="rub") goTo(pair.x+(cat.x>pair.x?10:-10),pair.y+1,"come");
  }
  if(mine) sharePair(p);
}
function endPair(){
  P.g.x=pair.x-3.5; P.b.x=pair.x+3.5; P.g.y=P.b.y=pair.y; P.g.tx=P.b.tx=null; pair=null;
  if(LIVE&&!otherHere()) writePos(other(),P[other()]);   // they're away, so keep their spot up to date for them
}
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=e=>{e.stopPropagation();act(b.dataset.a)});

addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||(e.target.matches&&e.target.matches("input,textarea"))) return;
  const k=e.key.toLowerCase();
  if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){keys.add(k);e.preventDefault();clearHold();}
  if(k==="c") act("cat"); if(k==="k") act("kiss"); if(k==="h") act("hug"); if(k==="e") act("e");
});
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
stage.addEventListener("pointerdown",e=>{
  if(!e.target.closest("#fm")) $("fm").style.display="none";
  if(e.target.closest("button,.say,#chat,#role,#fm")) return; clearHold();
  const r=stage.getBoundingClientRect(), a=P[sel];
  a.tx=Math.min(88,Math.max(12,(e.clientX-r.left)/r.width*100));
  a.ty=Math.min(80,Math.max(37,(e.clientY-r.top)/r.height*100));
});

function place(el,key,x,y,bob,rot){
  const s=S[key]; if(el._k!==key){el.src=s.src;el.style.width=(s.w*K/15.36)+"%";el._k=key;}
  el.style.display="block"; el.style.left=x+"%"; el.style.top=y+"%"; el.style.zIndex=Math.round(y*10);
  el.style.transform=`translate(-50%,calc(-100% + ${bob}px)) rotate(${rot||0}deg)`;
}
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  const map={g:["w","a","s","d"],b:["arrowup","arrowleft","arrowdown","arrowright"]};
  for(const k of ["g","b"]){
    const a=P[k]; a.mv=false; if(a.pose||pair) continue;
    const on=i=>LIVE?k===role&&(keys.has(map.g[i])||keys.has(map.b[i])):keys.has(map[k][i]);
    let dx=(on(3)?1:0)-(on(1)?1:0), dy=(on(2)?1:0)-(on(0)?1:0);
    if(dx||dy){a.tx=null; const L=Math.hypot(dx,dy); dx/=L; dy/=L;}
    else if(a.tx!=null){const ex=a.tx-a.x, ey=(a.ty-a.y)/1.5, L=Math.hypot(ex,ey); if(L<.8){a.tx=null}else{dx=ex/L;dy=ey/L}}
    if(dx||dy){
      a.mv=true; a.d=Math.abs(dx)>Math.abs(dy)?(dx<0?"left":"right"):(dy<0?"up":"down");
      a.x=Math.min(88,Math.max(12,a.x+dx*24*dt)); a.y=Math.min(80,Math.max(37,a.y+dy*36*dt));
      if(a.x>72&&a.y<46.5) a.y=46.5; if(a.x<25&&a.y>57) a.x=25;
    }
  }
  if(pair){ pairT-=dt; if(pairT<=0) endPair(); }
  if(pair){ els.g.style.display=els.b.style.display="none"; place(els.p,pair.n,pair.x,pair.y,0); }
  else{
    els.p.style.display="none";
    for(const k of ["g","b"]){ const a=P[k];
      const key=k+"_"+(a.pose||(a.mv?a.d:"idle"));
      place(els[k],key,a.x,a.y,a.mv?-Math.abs(Math.sin(t/90))*5:0,a.mv?Math.sin(t/90)*3:0);
    }
  }
  catStep(dt,t); sharePos(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- the grey Persian cat ----------
const BED={x:26,y:53.6};
const CATSAY={g:["Hello, gorgeous.","Who's the fluffiest? You are."],b:["Hey, buddy.","She picked you again."]};
const cat={x:BED.x,y:BED.y,d:"right",st:"sleep",tx:null,ty:null,t:20,mv:false,who:"g"};
const bub=document.createElement("div"); bub.className="bub"; stage.appendChild(bub); let bubT=0;
const cbtn=document.createElement("button"); cbtn.className="hs"; cbtn.setAttribute("aria-label","Pet the cat");
cbtn.style.cssText="width:8%;height:11%;z-index:1500;transform:translate(-50%,-100%)"; stage.appendChild(cbtn);
cbtn.onclick=e=>{e.stopPropagation();act("cat")};
const cd=a=>Math.hypot(cat.x-a.x,(cat.y-a.y)/1.5);
const near=()=>cd(P.g)<=cd(P.b)?"g":"b";
const meow=s=>{bub.textContent=s;bubT=1.8};
function goTo(x,y,st){cat.tx=Math.min(88,Math.max(12,x));cat.ty=Math.min(80,Math.max(37,y));cat.st=st;}
function startRub(k){
  cat.st="rub";cat.t=2.8;cat.tx=null;cat.who=k;heart(cat.x,cat.y-2);meow("purr...");
  const L=CATSAY[k][Math.floor(Math.random()*2)]; k==="g"?say(L,null):say(null,L);
}
function petCat(){
  const k=cd(P[near()])<16?near():sel; cat.who=k;
  if(cd(P[k])<11) startRub(k); else {goTo(P[k].x+(cat.x<P[k].x?-6:6),P[k].y+.5,"visit");meow("meow!");}
}
function arrive(){
  const s=cat.st; cat.tx=null;
  if(s==="visit") startRub(cat.who);
  else if(s==="bed"){cat.st="sleep";cat.t=25+Math.random()*20;}
  else if(s==="eatgo"){cat.st="eating";cat.t=4;meow("nom nom");}
  else if(s==="come"){cat.st="idle";cat.t=4;meow("meow");}
  else {cat.st="idle";cat.t=3+Math.random()*3;}
}
function decide(){
  const r=Math.random();
  if(bowlLevel()>0&&r<.3){goTo(BOWL.x,BOWL.y+1,"eatgo");return;}
  if(r<.4){const k=near();cat.who=k;goTo(P[k].x+(Math.random()<.5?-6:6),P[k].y+.5,"visit");}
  else if(r<.75) goTo(20+Math.random()*48,42+Math.random()*34,"wander");
  else goTo(BED.x,BED.y,"bed");
}
function catStep(dt,t){
  phoneStep(); jobStep(); cat.mv=false; cat.t-=dt; if(bubT>0) bubT-=dt;
  if(["visit","come","wander","bed","eatgo"].includes(cat.st)){
    const ex=cat.tx-cat.x, ey=(cat.ty-cat.y)/1.5, L=Math.hypot(ex,ey);
    if(L<.8) arrive(); else {cat.mv=true;cat.d=ex<0?"left":"right";cat.x+=ex/L*15*dt;cat.y+=ey/L*22.5*dt;}
  } else if(cat.st==="sleep"){
    if(cat.t<=0||cd(P.g)<9||cd(P.b)<9){cat.st="idle";cat.t=2;meow("mrrp?");}
  } else if(cat.t<=0) decide();
  const key=cat.st==="sleep"?"cat_sleep":cat.mv?"cat_"+(cat.d==="left"?"l":"r")+(Math.floor(t/140)%2+1):cat.st==="rub"?"cat_happy":"cat_sit";
  place(els.c,key,cat.x,cat.y,cat.mv?-Math.abs(Math.sin(t/110))*2:0);
  cbtn.style.left=cat.x+"%";cbtn.style.top=cat.y+"%";
  bub.style.left=cat.x+"%";bub.style.top=(cat.y-(cat.st==="sleep"?9:12))+"%";
  if(bubT>0) bub.style.display="block"; else if(cat.st==="sleep"){bub.textContent="z z z";bub.style.display="block";} else bub.style.display="none";
}

// ---------- using the furniture ----------
// [label, "pair"|"solo", pose, [x%, y% where they end up]]. Positions are % of the room.
const FURN={
  bed:{spot:[1130,180,1450,430],app:[78,46.5],opts:[["Sleep together","pair","sleep",[84,42]],["Sit on the bed","solo","sit",[80,42.8]]]},
  sofa:{spot:[150,600,380,820],app:[29,72],opts:[["Sit together","pair","sit",[17,74.5]],["Cuddle","pair","cuddle",[17.4,75]],["Scroll the phone","solo","phone",[15.5,74.5]]]},
  desk:{spot:[250,190,570,360],app:[33,40],opts:[["Use the laptop","solo","type",[29,34.5]]]}
};
const SOLO={sit:"Comfy.",type:"Just answering a few emails...",phone:"Scrolling..."};
let job=null;
Object.entries(FURN).forEach(([id,F])=>{
  const [x0,y0,x1,y1]=F.spot, b=document.createElement("button");
  b.className="hs"; b.setAttribute("aria-label",id);
  b.style.cssText=`left:${x0/15.36}%;top:${y0/10.24}%;width:${(x1-x0)/15.36}%;height:${(y1-y0)/10.24}%`;
  b.onclick=e=>{
    e.stopPropagation(); const m=$("fm"); m.innerHTML="";
    F.opts.forEach((o,i)=>{const c=document.createElement("button");c.textContent=o[0];c.onclick=ev=>{ev.stopPropagation();useFurn(id,i)};m.appendChild(c);});
    m.style.left=((x0+x1)/2/15.36)+"%"; m.style.top=((y0+y1)/2/10.24)+"%"; m.style.display="flex";
  };
  stage.appendChild(b);
});
function useFurn(id,i){
  const F=FURN[id],o=F.opts[i]; $("fm").style.display="none"; clearHold();
  if(o[1]==="pair"&&LIVE){ const k=role; P[k].tx=F.app[0]+(k==="g"?-2:2); P[k].ty=F.app[1]; job={k,pair:1,o}; }   // you walk over; they join you there
  else if(o[1]==="pair"){ P.g.tx=F.app[0]-2; P.b.tx=F.app[0]+2; P.g.ty=P.b.ty=F.app[1]; job={pair:1,o}; }
  else { const k=sel; P[k].tx=F.app[0]; P[k].ty=F.app[1]; job={k,o}; }
}
function jobStep(){
  if(!job||pair) return;
  const ks=job.k?[job.k]:["g","b"];
  if(!ks.every(k=>P[k].tx==null&&!P[k].mv)) return;
  const o=job.o;
  if(job.pair){ startPair({n:o[2],x:o[3][0],y:o[3][1],hold:1,f:1},true); }
  else{
    const a=P[job.k]; a.x=o[3][0]+(job.k==="b"?3:0); a.y=o[3][1];
    a.pose=o[2]==="phone"?"sit":o[2]; a.phone=o[2]==="phone"?1:0; a.hold=1;
    job.k==="g"?say(SOLO[o[2]],null):say(null,SOLO[o[2]]);
  }
  job=null;
}
const phones={g:$("phg"),b:$("phb")};
function phoneStep(){
  for(const k of ["g","b"]){ const a=P[k],e=phones[k];
    if(a.phone&&a.pose&&!pair){e.style.display="block";e.style.left=(a.x+(k==="g"?1.3:-1.3))+"%";e.style.top=(a.y-5)+"%";}
    else e.style.display="none";
  }
}

// ---------- day/night, cat food, messages, letters ----------
const NAME={g:"Pratiksha",b:"Him"};
const BOWL={x:47,y:77};
const W={night:true,fedAt:0,fedBy:""};
let db=null,role=null,tab="chat";
const box={chat:[],letter:[]};
function setRole(r){role=r;try{localStorage.setItem("role",r)}catch(e){} $("role").classList.remove("on");pick(r);}
let chooseRole=setRole;       // swapped for the signed-in version in boot()
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=e=>{e.stopPropagation();chooseRole(b.dataset.r)});
function clearHold(){
  job=null; for(const k of LIVE?[role]:["g","b"]){ P[k].phone=0; if(P[k].hold){P[k].pose=null;P[k].hold=0;} }
  if(pair&&pair.hold){ endPair(); sharePair(null); }
}
function applyWorld(){ $("sky").style.display=W.night?"none":"block"; $("tint").style.background=W.night?"transparent":"rgba(255,214,150,.16)"; }
const bowlLevel=()=>Math.max(0,1-(Date.now()-W.fedAt)/120000);
setInterval(()=>{$("bowl").firstChild.style.height=(bowlLevel()*46)+"%"},1000);
function setWorld(p){
  Object.assign(W,p); applyWorld();
  if(db) db.doc("world/state").set(W).catch(()=>toast("That didn't sync. Check your connection."));
}
function feedCat(){
  const k=role||sel; setWorld({fedAt:Date.now(),fedBy:k}); goTo(BOWL.x,BOWL.y+1,"eatgo"); meow("food!");
  k==="g"?say("Dinner time, fluffball!",null):say(null,"Dinner time, fluffball!");
}
function render(){
  const L=$("log"); L.innerHTML="";
  const arr=box[tab];
  if(!arr.length){const p=document.createElement("p");p.textContent=tab==="letter"?"No letters yet. Write the first one.":"Say hi.";L.appendChild(p);}
  arr.forEach(m=>{
    const d=document.createElement("div"); d.className="m"+(m.from===(role||sel)?" me":"");
    const s=document.createElement("small"); s.textContent=NAME[m.from]+" · "+new Date(m.ts).toLocaleString([],{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
    const p=document.createElement("span"); p.textContent=m.text; d.append(s,p); L.appendChild(d);
  });
  L.scrollTop=L.scrollHeight;
}
function openChat(t){
  tab=t; $("chat").classList.add("on");
  document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  $("tx").placeholder=t==="letter"?"Write a letter...":"Write a message..."; render();
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>openChat(b.dataset.tab));
$("x").onclick=()=>$("chat").classList.remove("on");
async function send(){
  const v=$("tx").value.trim(); if(!v) return;
  const m={from:role||sel,text:v.slice(0,1200),kind:tab==="letter"?"letter":"chat",ts:Date.now()};
  $("tx").value="";
  if(!db){box[tab].push(m);render();return;}
  try{await db.collection(tab==="letter"?"letters":"msgs").add(m);}catch(e){toast("Could not send. Check your connection.");}
}
$("send").onclick=send;
$("tx").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
// chat and letters live in separate collections so letters never get pushed out by chatter
function listen(col,kind,lim){
  let first=true;
  db.collection(col).orderBy("ts","desc").limit(lim).onSnapshot(snap=>{
    box[kind]=snap.docs.map(d=>d.data()).reverse();
    if(!first) snap.docChanges().forEach(c=>{
      if(c.type!=="added") return; const m=c.doc.data(), k=m.from;
      const line=m.kind==="letter"?"I left you a letter.":m.text;
      k==="g"?say(line,null):say(null,line);
      if(k!==role){ toast(m.kind==="letter"?NAME[k]+" left you a letter.":NAME[k]+": "+m.text.slice(0,40)); heart(P[k].x,P[k].y); }
    });
    first=false; render();
  },()=>{});
}

// ---------- live: where each of you is ----------
// pos/g and pos/b hold each character's spot; live/pair holds the kiss/hug/cuddle you're both in.
const HERE={g:"Pratiksha is here ♥",b:"He's here ♥"};
const other=()=>role==="g"?"b":"g";
const r1=v=>Math.round(v*10)/10;
let posReady=false,posKey="",posAt=0,seenPair=null,otherSeen=0;
const otherHere=()=>Date.now()-otherSeen<70000;
function writePos(k,a){
  const held=a.hold&&a.pose?a.pose:null, go=a.tx!=null;
  db.doc("pos/"+k).set({x:r1(a.x),y:r1(a.y),tx:go?r1(a.tx):null,ty:go?r1(a.ty):null,pose:held,phone:a.phone?1:0,by:role,ts:Date.now()}).catch(()=>{});
}
// called every frame; only writes when your target/pose changed, at most ~3x a second while walking
function sharePos(t){
  if(!LIVE||!posReady) return; const a=P[role], go=a.tx!=null;
  const k=[r1(go?a.tx:a.x),r1(go?a.ty:a.y),go,a.hold?a.pose:"",a.phone].join();
  if(k===posKey||t-posAt<300) return; posKey=k; posAt=t; writePos(role,a);
}
function applyPos(k,d,snap){
  const a=P[k]; if(snap){a.x=d.x;a.y=d.y;}
  if(d.pose){ a.x=d.x; a.y=d.y; a.tx=null; a.pose=d.pose; a.hold=1; a.phone=d.phone?1:0; }
  else{ if(a.hold){a.pose=null;a.hold=0;} a.phone=0; a.tx=d.tx!=null?d.tx:d.x; a.ty=d.ty!=null?d.ty:d.y; }
}
function sharePair(p){
  if(!LIVE) return; const id=Math.random().toString(36).slice(2); seenPair=id;
  db.doc("live/pair").set(p?{id,n:p.n,x:p.x,y:p.y,hold:p.hold?1:0,f:p.f?1:0,by:role,ts:Date.now()}:{id,n:null,by:role,ts:Date.now()}).catch(()=>{});
}

function startSync(){
  db.doc("world/state").onSnapshot(s=>{
    if(!s.exists) return; const d=s.data(), fresh=(d.fedAt||0)>W.fedAt;
    Object.assign(W,d); applyWorld();
    if(fresh&&d.fedBy&&d.fedBy!==role){ goTo(BOWL.x,BOWL.y+1,"eatgo"); toast(NAME[d.fedBy]+" fed the cat."); }
  },()=>{});
  listen("msgs","chat",80); listen("letters","letter",200);
  let firstPos=true;
  db.collection("pos").onSnapshot(snap=>{
    snap.docChanges().forEach(c=>{
      const k=c.doc.id, d=c.doc.data(); if(!P[k]||c.doc.metadata.hasPendingWrites) return;
      if(k===role){ if(firstPos) applyPos(k,d,true); return; }       // put you back where you left off
      if(firstPos){ if(Date.now()-(d.ts||0)<70000) otherSeen=Date.now(); }
      else if(d.by===k){ if(!otherHere()) toast(HERE[k]); otherSeen=Date.now(); }
      applyPos(k,d,firstPos);
    });
    firstPos=false; posReady=true;
  },()=>{posReady=true;});
  let firstPair=true;
  db.doc("live/pair").onSnapshot(s=>{
    const d=s.exists?s.data():null, first=firstPair; firstPair=false;
    if(!d||d.id===seenPair) return; seenPair=d.id;
    if(!d.n){ if(pair&&pair.hold) endPair(); return; }
    if(first&&!d.hold) return;      // an old kiss/hug that has already finished
    startPair(d,false);
  },()=>{});
  // a quiet heartbeat so the other one knows you're here
  const beat=()=>{ if(posReady&&document.visibilityState==="visible") writePos(role,P[role]); };
  setInterval(beat,45000); document.addEventListener("visibilitychange",beat);
}

// ---------- signing in: just the two of you ----------
// Paste the config from Firebase console > Project settings > Your apps. These values are safe to be public;
// the security rules are what keep everyone else out.
const FIREBASE={};
function showRole(mode,q){ $("rq").textContent=q; $("rpick").hidden=mode!=="pick"; $("gin").hidden=mode!=="signin"; $("role").classList.add("on"); }
function local(note){         // no connection: play on this device only, like before
  try{role=localStorage.getItem("role")}catch(e){}
  if(role) pick(role); else showRole("pick","Who is playing on this device?");
  toast(note||"Messages work on this device only.");
}
(function boot(){
  if(typeof firebase==="undefined"||!FIREBASE.apiKey) return local();
  firebase.initializeApp(FIREBASE);
  const auth=firebase.auth(), fs=firebase.firestore();
  $("gin").onclick=e=>{ e.stopPropagation();
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err=>{
      if(!/popup-closed|cancelled-popup/.test(err.code)) toast("Sign-in didn't work. Try again.");
    });
  };
  auth.onAuthStateChanged(async u=>{
    if(!u) return showRole("signin","Our Little World");
    if(LIVE) return;
    let me;
    try{ me=await fs.doc("users/"+u.uid).get(); }
    catch(e){
      if(e.code==="permission-denied"){ toast("Sorry, this little world is just for two."); return auth.signOut(); }
      return local("Can't reach our world right now. Playing on this device.");
    }
    const begin=r=>{ setRole(r); db=fs; LIVE=true; startSync(); };
    if(me.exists) return begin(me.data().role);
    chooseRole=r=>fs.doc("users/"+u.uid).set({role:r}).then(()=>begin(r),()=>toast("Hmm, that one isn't you."));
    showRole("pick","Who are you?");
  });
})();
applyWorld();

// greeting, then quiet chatter
P.g.pose="wave"; P.b.pose="wave"; say("Hi, you!","Hi, love.");
setTimeout(()=>{for(const k of ["g","b"]) if(P[k].pose==="wave") P[k].pose=null},2200);
setInterval(()=>{ if(pair||P.g.pose) return; const c=CHAT[Math.floor(Math.random()*CHAT.length)]; say(c[0],c[1]); },9000);
</script>
